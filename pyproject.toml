[project]
name = "residencial-aurora-agent"
version = "0.1.0"
description = "Assistente do Residencial Aurora com garantias de dominio no codigo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "google-adk[db]==2.2.0",
    "python-dotenv>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
